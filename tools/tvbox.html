<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TVBox converter</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #101827; color: #e5e7eb; font: 15px system-ui, sans-serif; }
    main { width: min(1100px, 94vw); margin: 28px auto; }
    .panel { background: #182235; border: 1px solid #334155; border-radius: 12px; padding: 18px; margin-top: 18px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: block; font-weight: 600; margin: 10px 0 6px; }
    input, select, textarea, button { width: 100%; border: 1px solid #475569; border-radius: 7px; background: #0f172a; color: #e5e7eb; padding: 10px; font: inherit; }
    textarea { min-height: 220px; resize: vertical; line-height: 1.45; }
    button { background: #2563eb; border: 0; cursor: pointer; font-weight: 700; }
    button:hover { background: #1d4ed8; }
    .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    .secondary { background: #475569; }
    .secondary:hover { background: #64748b; }
    iframe { width: 100%; height: 300px; border: 1px solid #475569; border-radius: 7px; background: white; }
    #message { color: #93c5fd; min-height: 24px; margin-top: 12px; white-space: pre-wrap; }
    @media (max-width: 700px) { .row, .buttons { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>TVBox converter</h1>
  <p>Paste JSON or TVBox encrypted Hex, then click <b>Process</b>. The result appears below and in the frame.</p>

  <section class="panel">
    <div class="row">
      <div>
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="enc">Encrypt JSON</option>
          <option value="dec">Decrypt Hex / JSON</option>
          <option value="format">Format JSON / show text</option>
        </select>
      </div>
      <div>
        <label for="file">Or choose a local file</label>
        <input id="file" type="file">
      </div>
    </div>

    <div class="row">
      <div><label for="key">Key</label><input id="key" value="1234567890123"></div>
      <div><label for="iv">IV</label><input id="iv" value="1234567890123"></div>
    </div>

    <label for="input">Input</label>
    <textarea id="input" spellcheck="false" placeholder="Paste JSON or encrypted Hex here"></textarea>

    <div class="buttons">
      <button id="process" type="button">Process and show result</button>
      <button id="copy" class="secondary" type="button">Copy result</button>
      <button id="save" class="secondary" type="button">Save result</button>
    </div>
    <div id="message">Ready. No external library is required.</div>
  </section>

  <section class="panel">
    <label for="output">Result</label>
    <textarea id="output" spellcheck="false" readonly></textarea>
    <label for="preview">Result frame</label>
    <iframe id="preview" title="Result preview" sandbox=""></iframe>
  </section>
</main>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var encoder = new TextEncoder();
  var decoder = new TextDecoder();

  function setMessage(text) { $("message").textContent = text; }
  function bytesToHex(bytes) {
    return Array.from(bytes, function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }
  function hexToBytes(hex) {
    if (!/^[0-9a-f]+$/i.test(hex) || hex.length % 2 !== 0) throw new Error("Invalid hexadecimal input");
    return Uint8Array.from(hex.match(/../g), function (part) { return parseInt(part, 16); });
  }
  function padded(value) {
    return encoder.encode((value + "0000000000000000").slice(0, 16));
  }
  function clean(text) { return text.replace(/^\/\/.*$/gm, "").trim(); }
  function keyFor(value) {
    return crypto.subtle.importKey("raw", padded(value), { name: "AES-CBC" }, false, ["encrypt", "decrypt"]);
  }
  function headerHex(value) { return bytesToHex(encoder.encode(value)); }

  async function encryptJson(text) {
    var keyText = $("key").value;
    var ivText = $("iv").value;
    var data = JSON.parse(clean(text));
    var plaintext = encoder.encode(JSON.stringify(data, null, 2));
    var ciphertext = await crypto.subtle.encrypt(
      { name: "AES-CBC", iv: padded(ivText) },
      await keyFor(keyText),
      plaintext
    );
    return headerHex("$#" + keyText + "#$") + bytesToHex(new Uint8Array(ciphertext)) + headerHex(ivText);
  }

  async function decryptTvbox(text) {
    var input = clean(text);
    try { return JSON.stringify(JSON.parse(input), null, 2); } catch (ignored) {}
    if (!/^[0-9a-f]+$/i.test(input) || input.length % 2 !== 0) throw new Error("Input is not JSON or valid Hex");

    var marker = input.indexOf(headerHex("#$"));
    if (marker < 0) throw new Error("TVBox header #$ was not found");

    var headerEnd = marker + 4;
    var ivHex = input.slice(-26);
    var cipherHex = input.slice(headerEnd, -26);
    var realKey = decoder.decode(hexToBytes(input.slice(0, headerEnd))).slice(2, -2);
    var realIv = decoder.decode(hexToBytes(ivHex));
    var plaintext = await crypto.subtle.decrypt(
      { name: "AES-CBC", iv: padded(realIv) },
      await keyFor(realKey),
      hexToBytes(cipherHex)
    );
    var decoded = decoder.decode(plaintext);
    return JSON.stringify(JSON.parse(decoded), null, 2);
  }

  function display(text) {
    $("output").value = text;
    var escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    $("preview").srcdoc = "<pre style='white-space:pre-wrap;overflow-wrap:anywhere;padding:14px'>" + escaped + "</pre>";
  }

  $("file").addEventListener("change", function (event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () { $("input").value = reader.result; setMessage("File loaded. Click Process and show result."); };
    reader.onerror = function () { setMessage("Could not read the file."); };
    reader.readAsText(file);
  });

  $("process").addEventListener("click", async function () {
    try {
      var source = $("input").value;
      if (!source.trim()) throw new Error("Paste input or choose a file first");
      setMessage("Processing...");
      var mode = $("mode").value;
      var result;
      if (mode === "enc") result = await encryptJson(source);
      else if (mode === "dec") result = await decryptTvbox(source);
      else {
        var cleaned = clean(source);
        try { result = JSON.stringify(JSON.parse(cleaned), null, 2); } catch (ignored) { result = cleaned; }
      }
      display(result);
      setMessage("Done. Result length: " + result.length + " characters.");
    } catch (error) {
      display("");
      setMessage("Error: " + (error && error.message ? error.message : error));
    }
  });

  $("copy").addEventListener("click", async function () {
    var value = $("output").value;
    if (!value) return setMessage("Nothing to copy.");
    try { await navigator.clipboard.writeText(value); setMessage("Result copied."); }
    catch (_) { setMessage("Clipboard access was blocked by the browser."); }
  });

  $("save").addEventListener("click", function () {
    var value = $("output").value;
    if (!value) return setMessage("Nothing to save.");
    var link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([value], { type: "text/plain;charset=utf-8" }));
    link.download = $("mode").value === "dec" ? "tvbox-result.json" : "tvbox-result.txt";
    link.click();
    URL.revokeObjectURL(link.href);
    setMessage("Result saved.");
  });
}());
</script>
</body>
</html>
