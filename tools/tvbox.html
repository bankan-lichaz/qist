<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TVBox 文件加解密工具</title>
  <style>
    :root { --bg:#f4f6f8; --panel:#fff; --panel-strong:#eef2f7; --text:#1d2433; --muted:#667085; --border:#dfe5ee; --button:#2563eb; --button-text:#fff; --button-alt:#e7edf7; --shadow:rgba(15,23,42,.08); --input-bg:#fff; --status-bg:#edf2ff; --status-text:#1f2a44; --result-bg:#f9fafb; }
    :root.dark { --bg:#0f172a; --panel:#111827; --panel-strong:#1f2937; --text:#e5eefb; --muted:#9aa9bc; --border:#2d3748; --button:#60a5fa; --button-text:#08111f; --button-alt:#1f2937; --shadow:rgba(0,0,0,.32); --input-bg:#0b1220; --status-bg:#162235; --status-text:#dfeaff; --result-bg:#0b1220; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif; }
    body { max-width:900px; margin:2rem auto; padding:0 1rem 2rem; line-height:1.6; }
    h1 { margin-bottom:.25rem; } .hint { color:var(--muted); margin-top:0; }
    .header-row { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem; }
    label { display:block; font-weight:600; margin-top:1rem; }
    input,select,button,textarea { width:100%; padding:.7rem .8rem; margin-top:.35rem; font:inherit; border-radius:.55rem; border:1px solid var(--border); background:var(--input-bg); color:var(--text); }
    textarea { min-height:180px; resize:vertical; background:var(--result-bg); }
    button { cursor:pointer; font-weight:700; border:1px solid transparent; background:var(--button); color:var(--button-text); box-shadow:0 6px 18px var(--shadow); }
    button.secondary,.theme-toggle { background:var(--button-alt); color:var(--text); border-color:var(--border); box-shadow:none; }
    .row,.actions { display:grid; grid-template-columns:1fr 1fr; gap:1rem; } .actions { margin:.6rem 0 .8rem; }
    button:disabled { cursor:not-allowed; opacity:.6; } #resultPanel { display:none; }
    #status { white-space:pre-wrap; background:var(--status-bg); color:var(--status-text); padding:.8rem .9rem; border-radius:.6rem; margin-top:1rem; border:1px solid var(--border); }
    @media (max-width:650px) { .row,.actions,.header-row { grid-template-columns:1fr; display:grid; } .header-row { align-items:start; } .theme-toggle { width:fit-content; } }
  </style>
</head>
<body>
  <div class="header-row"><h1>TVBox 文件加解密工具</h1><button class="theme-toggle" id="themeToggle" type="button">🌙 深色</button></div>
  <p class="hint">解密会自动从密文头部读取 Key、从密文末尾读取 Iv，无需手动输入。加密时可自定义 Key 和 Iv，留空使用默认值。所有处理均在浏览器本地完成。</p>
  <label for="source">输入文件或 URL</label><input id="source" type="text" placeholder="选择本地文件，或粘贴 http(s):// 地址"><input id="file" type="file" accept=".json,.txt,.hex,.tvbox">
  <div class="row">
    <div><label for="mode">模式</label><select id="mode"><option value="dec">解密</option><option value="enc">加密</option><option value="get">获取 URL 内容</option></select></div>
    <div><label for="name">下载文件名</label><input id="name" value="output.json"></div>
  </div>
  <div class="row" id="keyIvFields">
    <div><label for="key">Key（最多 16 个 ASCII 字节）</label><input id="key" type="text" placeholder="留空使用默认 Key"></div>
    <div><label for="iv">Iv（必须为 13 个 ASCII 字符）</label><input id="iv" type="text" placeholder="留空使用默认 Iv"></div>
  </div>
  <label for="text">或直接粘贴内容（优先使用此内容）</label><textarea id="text" placeholder="JSON、加密 hex 内容或 URL 返回的文本"></textarea>
  <button id="run" type="button">开始处理</button><div id="status">等待处理…</div>
  <section id="resultPanel"><label for="result">处理结果</label><div class="actions"><button id="download" class="secondary" type="button">下载结果</button><button id="copy" class="secondary" type="button">复制结果</button></div><textarea id="result" readonly placeholder="处理结果会显示在这里"></textarea></section>
<script>
'use strict';
const DEFAULT_KEY='1234567890123', DEFAULT_IV='1234567890123';
let processedResult='', processedFilename='output.json';
const $=id=>document.getElementById(id);
function applyTheme(theme){const dark=theme==='dark';document.documentElement.classList.toggle('dark',dark);$('themeToggle').textContent=dark?'☀️ 浅色':'🌙 深色';localStorage.setItem('tvbox-theme',theme);}
const savedTheme=localStorage.getItem('tvbox-theme'); applyTheme(savedTheme==='dark'||(!savedTheme&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
$('themeToggle').addEventListener('click',()=>applyTheme(document.documentElement.classList.contains('dark')?'light':'dark'));
function log(message){$('status').textContent=message;}
function hexToBytes(hex){if(!/^[0-9a-f]+$/i.test(hex)||hex.length%2)throw new Error('不是有效的 hex 数据');const r=new Uint8Array(hex.length/2);for(let i=0;i<r.length;i++)r[i]=parseInt(hex.slice(i*2,i*2+2),16);return r;}
function bytesToHex(bytes){return [...new Uint8Array(bytes)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function textToHex(text){return bytesToHex(new TextEncoder().encode(text));}
function bytesToText(bytes){return new TextDecoder().decode(bytes);}
function padded16(text,label){const bytes=new TextEncoder().encode(text);if(bytes.length>16)throw new Error(`${label} 不能超过 16 个 ASCII 字节`);const out=new Uint8Array(16);out.set(bytes);return out;}
function pkcs7Pad(bytes){const n=16-(bytes.length%16),out=new Uint8Array(bytes.length+n);out.set(bytes);out.fill(n,bytes.length);return out;}
function pkcs7Unpad(bytes){if(!bytes.length||bytes.length%16)throw new Error('解密数据长度无效');const n=bytes[bytes.length-1];if(n<1||n>16||bytes.slice(-n).some(x=>x!==n))throw new Error('PKCS#7 填充无效');return bytes.slice(0,-n);}
async function decryptHex(input){
  const hex=input.replace(/^\/\/.*$/gm,'').trim();
  try{return JSON.stringify(JSON.parse(hex),null,2);}catch(_){}
  if(!/^[0-9a-f]+$/i.test(hex))throw new Error('内容既不是 JSON 也不是有效的 hex 加密数据');
  const markerPos=hex.indexOf('2324');
  if(markerPos<2||hex.length<markerPos+4+26)throw new Error('文件格式错误：未找到有效的头部标记或数据长度不足');
  const headerEnd=markerPos+4, header=bytesToText(hexToBytes(hex.slice(0,headerEnd)));
  if(!header.startsWith('$#')||!header.endsWith('#$'))throw new Error('无效的加密头部');
  const key=header.slice(2,-2), iv=bytesToText(hexToBytes(hex.slice(-26)));
  if(new TextEncoder().encode(iv).length!==13)throw new Error('密文末尾的 Iv 无效');
  const cipherHex=hex.slice(headerEnd,-26); if(!cipherHex||cipherHex.length%32)throw new Error('密文长度无效');
  const cryptoKey=await crypto.subtle.importKey('raw',padded16(key,'Key'),{name:'AES-CBC'},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-CBC',iv:padded16(iv,'Iv')},cryptoKey,hexToBytes(cipherHex));
  return JSON.stringify(JSON.parse(bytesToText(pkcs7Unpad(new Uint8Array(plain)))),null,2);
}
async function encryptJson(input){
  const data=JSON.parse(input.replace(/^\/\/.*$/gm,'').trim());
  const key=$('key').value||DEFAULT_KEY, iv=$('iv').value||DEFAULT_IV;
  const keyBytes=padded16(key,'Key');
  if(new TextEncoder().encode(iv).length!==13)throw new Error('Iv 必须为 13 个 ASCII 字符（密文格式从末尾读取 Iv）');
  const cryptoKey=await crypto.subtle.importKey('raw',keyBytes,{name:'AES-CBC'},false,['encrypt']);
  const plain=pkcs7Pad(new TextEncoder().encode(JSON.stringify(data)));
  const encrypted=await crypto.subtle.encrypt({name:'AES-CBC',iv:padded16(iv,'Iv')},cryptoKey,plain);
  return textToHex(`$#${key}#$`)+bytesToHex(encrypted)+textToHex(iv);
}
async function fetchContent(url){const response=await fetch(url);if(!response.ok)throw new Error(`HTTP ${response.status} ${response.statusText}`);return await response.text();}
function download(content,filename){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));a.download=filename||'output.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
async function getInput(){if($('text').value.trim())return $('text').value;const file=$('file').files[0];if(file)return await file.text();const source=$('source').value.trim();if(/^https?:\/\//i.test(source))return await fetchContent(source);throw new Error('请提供输入内容、文件或 URL');}
function updateKeyIvVisibility(){$('keyIvFields').style.display=$('mode').value==='enc'?'grid':'none';}
$('mode').addEventListener('change',updateKeyIvVisibility); updateKeyIvVisibility();
$('run').addEventListener('click',async()=>{$('run').disabled=true;$('resultPanel').style.display='none';log('处理中…');try{const mode=$('mode').value,input=await getInput();let output,filename=$('name').value.trim();if(mode==='dec'){output=await decryptHex(input);if(!filename||filename==='output.json')filename='output.json';}else if(mode==='enc'){output=await encryptJson(input);if(!filename||filename==='output.json')filename='encrypted.txt';}else{output=input;if(!filename||filename==='output.json')filename='output.txt';}processedResult=output;processedFilename=filename;$('result').value=output;$('resultPanel').style.display='block';log('处理成功，请检查结果后选择上方的“下载结果”或“复制结果”。');}catch(error){log(`处理失败：${error.message}`);}finally{$('run').disabled=false;}});
$('download').addEventListener('click',()=>{if(processedResult){download(processedResult,processedFilename);log(`已下载：${processedFilename}`);}});
$('copy').addEventListener('click',async()=>{if(!processedResult)return;try{await navigator.clipboard.writeText(processedResult);}catch(_){$('result').focus();$('result').select();document.execCommand('copy');}log('结果已复制到剪贴板。');});
</script>
</body>
</html>
