# 工作流名称
name: 自动更新spider.jar

# 触发条件：定时任务 + 手动触发
on:
  schedule:
    # 每天UTC时间16点执行（对应北京时间次日0点，如需北京时间8点执行请修改为 '0 0 * * *'）
    - cron: '0 16 * * *'
  # 允许在Actions页面手动点击触发执行
  workflow_dispatch:

# 授予工作流推送代码到仓库的权限
permissions:
  contents: write

# 执行任务
jobs:
  update-spider:
    # 运行环境
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取master分支最新代码
      - name: 拉取master分支代码
        uses: actions/checkout@v4
        with:
          ref: master

      # 2. 创建目录并下载spider.jar
      - name: 下载spider.jar
        run: |
          set -e # 命令执行失败立即退出
          mkdir -p jar # 确保jar目录存在
          curl -f -L --retry 3 --retry-delay 5 -o jar/spider.jar https://raw.githubusercontent.com/qist/tvbox/refs/heads/master/jar/spider.jar
          curl -f -L --retry 3 --retry-delay 5 -o jar/fan.txt https://raw.githubusercontent.com/qist/tvbox/refs/heads/master/jar/fan.txt

      # 3. 配置Git提交信息（使用官方机器人账号，不会计入个人提交贡献）
      - name: 配置Git用户信息
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 4. 仅当文件有变更时才提交推送，避免空提交
    
      - name: 提交并推送更新
        run: |
          set -e
           if [ -n "$(git status --porcelain jar/)" ]; then
              git add jar/
              git commit -m "chore: 自动更新spider.jar和fan.txt"
              git push origin HEAD:master
            fi

